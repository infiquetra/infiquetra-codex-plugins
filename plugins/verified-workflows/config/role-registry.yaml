schema_version: 1
role_spec_version: 1
source_contract:
  frozen_source_commit: 38742ece89880a6b140be237edad6d3f13c97b54
  legacy_plugin_git_tree: 66b23ca83b6ce3b29871954c63a6554c39bfd72e
  source_row_ids:
  - src-7ca0384cf8d21d44
  - src-7631fbd9f42a5bf2
  - src-76516b36df832272
  source_file_sha256:
    reviewer-registry.md: 6452b315f087617689023d430398d007ed59483c950b0f26297a73ff65a6b88c
    validator-criteria.md: def8e4c8ef02ab16289b769df9655f32eee73fd95627adc17bd5c72f2090a279
    validator-registry.md: 76ee0c42002b8c4ab6c80b0a222cc9e83b9068da0ca4a03b06c598e71ca0e5e5
assurance_policy:
  required_independent_reviewers: 1
  default_required_reviewer: devils-advocate-reviewer
  additional_reviewer_selection: risk-triggered
  implementer_or_descendant_may_review: false
review_policy:
  dimension_score_type: number[0,10]
  overall_calculation: arithmetic-mean-of-applicable-dimensions
  minimum_acceptance_average: 9.0
  minimum_dimension_score: 7.0
  exclusion_reason: static-non-applicable
  role_specific_hard_stops_override: true
result_schemas:
  assignment-result.v1:
    required_fields:
    - assignment_id
    - attempt_id
    - agent_path
    - role_id
    - profile_id
    - terminal_status
    - summary
    - changed_paths
    - no_change
    - checks
    - findings
    - residual_risks
    terminal_statuses:
    - completed
    - failed
    - interrupted
    - blocked
    change_rule: changed_paths must be empty exactly when no_change is true
  reviewer-result.v1:
    extends: assignment-result.v1
    required_fields:
    - dimensions
    - exclusions
    - denominator
    - overall
    - verdict
    - hard_stop
    verdicts:
    - accept
    - needs-revision
    - blocking
result_types:
  check:
    required_fields:
    - check_id
    - status
    - detail
    statuses:
    - pass
    - warn
    - failed
    - blocked
  finding:
    required_fields:
    - finding_id
    - severity
    - category
    - location
    - impact
    - fix
    - validation
    - resolved
    - hard_stop
    severities:
    - P0
    - P1
    - P2
    - P3
  scored-dimension:
    required_fields:
    - dimension_id
    - score
    - notes
    score: number[0,10]
  typed-exclusion:
    required_fields:
    - dimension_id
    - reason
    reasons:
    - static-non-applicable
roles:
- id: ai-usefulness-reviewer
  kind: agent-lens
  category: reviewer
  spec_version: 1
  spec: roles/ai-usefulness-reviewer.md
  description: 'Optional reviewer for verified-workflows. Reviews specifications, issue templates, SKILL.md
    files, AGENTS.md sections, and task descriptions for AI-consumability: context completeness, unambiguous
    acceptance criteria, example coverage, constraint explicitness, and machine-parseable structure. Triggered
    when plan contains: issue template, GitHub issue, task description, acceptance criteria, AI prompt,
    SKILL.md, AGENTS.md, spec. NOT for: dumbing down content; general documentation quality (clarity-reviewer).
    Focus: making specs structured and explicit for AI consumption.'
  selection:
    mode: conditional
    signals:
    - issue template
    - GitHub issue
    - task description
    - acceptance criteria
    - AI prompt
    - SKILL.md
    - AGENTS.md
    - spec
  minimum_independence: required
  default_profile: review_high
  allowed_profiles:
  - review_high
  - review_max
  boundaries:
    workspace_cap: read-only
    external_cap: none
    external_mutation: forbidden
    profile_may_not_widen_role: true
  result_schema: reviewer-result.v1
  source_behavior_sha256: 445853509f9f1ab3794fa7352514fbcb91be2d37bcde64fbc416de97c76e7b8c
