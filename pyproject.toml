[project]
name = "infiquetra-codex-plugins"
version = "0.1.0"
description = "Codex-native Infiquetra plugin adapters"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pillow>=12.2.0",
  "pytest>=8.0.0",
  "pyyaml>=6.0.3",
  "requests>=2.31.0",
  "urllib3>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "plugins/fleet-core/tests",
  "plugins/mission-control/tests",
  "plugins/deploy/tests",
  "plugins/verified-workflows/tests",
  "plugins/verified-workflows/tests",
  "plugins/saga/tests",
  "plugins/discord-identity-assets/tests",
  "plugins/unifi/tests",
]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "plugins/mission-control/config/generated/issue_contract_data.py",
  "plugins/mission-control/config/generated/issue_contract_shim.py",
]
