[project]
name = "infiquetra-codex-plugins"
version = "0.1.0"
description = "Codex-native Infiquetra plugin adapters"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "plugins/mission-control/tests",
  "plugins/deploy/tests",
  "plugins/team-execution/tests",
  "plugins/saga/tests",
]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
