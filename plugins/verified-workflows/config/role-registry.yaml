  legacy_plugin_git_tree: 66b23ca83b6ce3b29871954c63a6554c39bfd72e
  source_row_ids:
  - src-7ca0384cf8d21d44
  - src-7631fbd9f42a5bf2
  - src-76516b36df832272
  source_file_sha256:
    reviewer-registry.md: 6452b315f087617689023d430398d007ed59483c950b0f26297a73ff65a6b88c
    validator-criteria.md: def8e4c8ef02ab16289b769df9655f32eee73fd95627adc17bd5c72f2090a279
    validator-registry.md: 76ee0c42002b8c4ab6c80b0a222cc9e83b9068da0ca4a03b06c598e71ca0e5e5
source_behavior_policy:
  base_reviewer_ids:
  - devils-advocate-reviewer
  - security-reviewer
  - architecture-reviewer
  plan_types:
  - code
  - docs-specs
  - mixed
  docs_only_requires_full_review: true
  triage_all_required:
  - single-config-file
  - no-security-surface
  - fewer-than-three-files
  - no-doc-or-spec-content
  triage_options:
  - skip-review
  - full-review
  - devils-advocate-only
  custom_reviewer_contract: user-supplied-versioned-agent-lens
  validator_selection_inputs:
  - repo-type-and-tooling
  - changed-and-staged-files
  - github-workflows
  - contracts-and-schemas
  - docs-runbooks-and-scenario-hints
  - existing-tests-and-quality-commands
  - verified-workflows-config
  required_validator_absence: blocked
  disabled_validator_default: skipped-by-config
  automation_remote: github.com/infiquetra/*
  automation_requires_default_branch: true
  automation_environments:
  - nonprod
  - publish-nonprod
  automation_forbidden:
  - production
  - staging
  - force-push
  - branch-deletion
  - credential-change
  advisory_deferrals:
    external-advisory-reviewer:
      unit: U7
      active: false
      gate_authority: none
    external-second-opinion:
      unit: U7
      active: false
      gate_authority: none
selection_config_keys:
- required_validators
- disabled_validators
- nonprod_workflows
- scenario_hints
- smoke_targets
- external_second_opinion
root_only_actions:
- git-mutation
- workflow-state
- integration
- merge
- deploy-initiation
- credential-change
- completion
gate_statuses:
- pass
- warn
- hard-fail
- skipped-by-config
- blocked
review_policy:
  dimension_score_type: number[0,10]
  overall_calculation: arithmetic-mean-of-applicable-dimensions
  minimum_acceptance_average: 9.0
  minimum_dimension_score: 7.0
  exclusion_reason: static-non-applicable
  role_specific_hard_stops_override: true
evidence_schemas:
  review-evidence.v1:
    required_fields:
    - role_id
    - role_digest
    - input_digest
    - dimensions
    - denominator
    - overall
    - verdict
    - findings
    - exclusions
    field_types:
      role_id: role-id
      role_digest: sha256
      input_digest: sha256
      dimensions: list[scored-dimension]
      denominator: integer
      overall: number[0,10]
      verdict: enum
      findings: list[typed-finding]
      exclusions: list[typed-exclusion]
    enum_fields:
      verdict:
      - accept
      - needs-revision
      - blocking
  scanner-evidence.v1:
    required_fields:
    - role_id
    - role_digest
    - required
    - tools
    - argv
    - cwd
    - exit_codes
    - evidence_refs
    - findings
    - gate_status
    - missing_tool_guidance
    field_types:
      role_id: role-id
      role_digest: sha256
      required: boolean
      tools: list[string]
      argv: list[list[string]]
      cwd: repo-relative-path
      exit_codes: list[integer]
      evidence_refs: list[evidence-ref]
      findings: list[typed-finding]
      gate_status: enum
      missing_tool_guidance: list[string]
    enum_fields:
      gate_status:
      - pass
      - warn
      - hard-fail
      - skipped-by-config
      - blocked
  tester-evidence.v1:
    required_fields:
    - role_id
    - role_digest
    - target
    - declared_argv
    - expected
    - actual
    - exit_code
    - evidence_refs
    - cases
    - gate_status
    field_types:
      role_id: role-id
      role_digest: sha256
      target: string
      declared_argv: list[string]
      expected: string
      actual: string
      exit_code: integer
      evidence_refs: list[evidence-ref]
      cases: list[test-case]
      gate_status: enum
    enum_fields:
      gate_status:
      - pass
      - warn
      - hard-fail
      - skipped-by-config
      - blocked
  monitor-evidence.v1:
    required_fields:
    - role_id
    - role_digest
    - system
    - environment
    - time_window
    - observations
    - evidence_refs
    - health_state
    - gate_status
    field_types:
      role_id: role-id
      role_digest: sha256
      system: string
      environment: string
      time_window: time-window
      observations: list[observation]
      evidence_refs: list[evidence-ref]
      health_state: enum
      gate_status: enum
    enum_fields:
      health_state:
      - healthy
      - degraded
      - missing-signal
      - not-applicable
      gate_status:
      - pass
      - warn
      - hard-fail
      - skipped-by-config
      - blocked
  deploy-observation.v1:
    required_fields:
    - role_id
    - role_digest
    - remote
    - workflow
    - run_ref
    - commit_sha
    - environment
    - eligibility
    - prerequisite_gate_refs
    - evidence_refs
    - rollback_notes
    - run_status
    - gate_status
    field_types:
      role_id: role-id
      role_digest: sha256
      remote: string
      workflow: string
      run_ref: string
      commit_sha: git-sha
      environment: string
      eligibility: boolean
      prerequisite_gate_refs: list[evidence-ref]
      evidence_refs: list[evidence-ref]
      rollback_notes: string
      run_status: enum
      gate_status: enum
    enum_fields:
      run_status:
      - queued
      - in-progress
      - succeeded
      - failed
      - cancelled
      - unknown
      gate_status:
      - pass
      - warn
      - hard-fail
      - skipped-by-config
      - blocked
roles:
- id: ai-usefulness-reviewer
  kind: agent-lens
  category: reviewer
  spec_version: 1
  spec: roles/ai-usefulness-reviewer.md
  description: 'Optional reviewer for verified-workflows. Reviews specifications, issue templates, SKILL.md files, AGENTS.md sections, and task descriptions for AI-consumability: context completeness, unambiguous acceptance criteria, example coverage, constraint explicitness, and machine-parseable structure. Triggered when plan contains: issue template, GitHub issue, task description, acceptance criteria, AI prompt, SKILL.md, AGENTS.md, spec. NOT for: dumbing down content; general documentation quality (clarity-reviewer). Focus: making specs structured and explicit for AI consumption.'
  selection:
    mode: conditional
    signals:
    - issue template
    - GitHub issue
    - task description
    - acceptance criteria
    - AI prompt
    - SKILL.md
    - AGENTS.md
    - spec
  minimum_independence: preferred
  default_class: review-high
  allowed_classes:
  - review-high
  - review-max
  boundaries:
    workspace_cap: read-only
    external_cap: none
    external_mutation: forbidden
    class_may_not_widen_role: true
  output_schema: review-evidence.v1
  source_behavior_sha256: 445853509f9f1ab3794fa7352514fbcb91be2d37bcde64fbc416de97c76e7b8c
