<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
</marker>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
</filter>
</defs>
<rect width="1100" height="760" fill="#f8fafc"/>
<text x="70" y="72" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850" fill="#172033">Saga Readiness Ladder</text>
<text x="72" y="112" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#5b6472">Maturity is derived from lifecycle phase and artifact evidence; it is not stored as an independent source.</text>
<circle cx="102" cy="204" r="25" fill="#2563eb"/>
<text x="92" y="213" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">1</text>
<rect x="150" y="170" width="860" height="70" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="178" y="201" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#2563eb">idea-ready</text>
<text x="178" y="227" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6472"><tspan x="178" dy="0">A direction exists and can be evaluated.</tspan></text>
<line x1="102" y1="232" x2="102" y2="266" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowhead)"/>
<circle cx="102" cy="306" r="25" fill="#0f766e"/>
<text x="92" y="315" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">2</text>
<rect x="150" y="272" width="860" height="70" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="178" y="303" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f766e">requirements-ready</text>
<text x="178" y="329" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6472"><tspan x="178" dy="0">The chosen idea has durable requirements.</tspan></text>
<line x1="102" y1="334" x2="102" y2="368" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowhead)"/>
<circle cx="102" cy="408" r="25" fill="#16a34a"/>
<text x="92" y="417" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">3</text>
<rect x="150" y="374" width="860" height="70" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="178" y="405" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#16a34a">plan-ready</text>
<text x="178" y="431" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6472"><tspan x="178" dy="0">The plan has passed readiness review.</tspan></text>
<line x1="102" y1="436" x2="102" y2="470" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowhead)"/>
<circle cx="102" cy="510" r="25" fill="#7c3aed"/>
<text x="92" y="519" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">4</text>
<rect x="150" y="476" width="860" height="70" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="178" y="507" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#7c3aed">resume-ready</text>
<text x="178" y="533" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6472"><tspan x="178" dy="0">Execution state can be resumed from artifacts.</tspan></text>
<line x1="102" y1="538" x2="102" y2="572" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowhead)"/>
<circle cx="102" cy="612" r="25" fill="#475569"/>
<text x="92" y="621" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">5</text>
<rect x="150" y="578" width="860" height="70" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="178" y="609" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#475569">deferred-context</text>
<text x="178" y="635" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6472"><tspan x="178" dy="0">Saga has handed context to another owner.</tspan></text>
<rect x="150" y="650" width="860" height="70" rx="10" fill="#fefce8" stroke="#facc15" stroke-width="1"/>
<text x="178" y="682" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#d97706">Operational rule</text>
<text x="348" y="682" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#172033"><tspan x="348" dy="0">When evidence and lifecycle phase disagree, the operator re-reads the</tspan><tspan x="348" dy="22">durable artifact and updates the route before mutation.</tspan></text>
</svg>
